<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ACKO Drive splash — static mockup</title>
    <style>
      @font-face {
        font-family: "Euclid Circular B";
        src: url("https://pub-c050457d48794d5bb9ffc2b4649de2c1.r2.dev/Euclid%20Font/EuclidCircularB-Regular.otf")
          format("opentype");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: "Euclid Circular B";
        src: url("https://pub-c050457d48794d5bb9ffc2b4649de2c1.r2.dev/Euclid%20Font/EuclidCircularB-Medium.otf")
          format("opentype");
        font-weight: 500;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: "Euclid Circular B";
        src: url("https://pub-c050457d48794d5bb9ffc2b4649de2c1.r2.dev/Euclid%20Font/EuclidCircularB-Semibold.otf")
          format("opentype");
        font-weight: 600;
        font-style: normal;
        font-display: swap;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #0a0a0a;
        font-family: "Euclid Circular B", system-ui, sans-serif;
      }
      .phone {
        position: relative;
        width: 360px;
        height: 800px;
        overflow: hidden;
        border-radius: 24px;
        background: #121212;
        color: #fff;
      }
      .status-bar {
        position: absolute;
        top: 0;
        left: 0;
        width: 360px;
        height: 40px;
        max-width: none;
        display: block;
        object-fit: fill;
        z-index: 2;
        pointer-events: none;
        user-select: none;
      }
      .header {
        position: relative;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 20px;
      }
      .logo {
        height: 28px;
        width: auto;
      }
      .stage {
        position: relative;
        height: 620px;
      }
      .card {
        position: absolute;
        width: 164px;
        height: 192px;
        border-radius: 24px;
        overflow: hidden;
        background: transparent;
      }
      .card img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .card-1 {
        left: 41px;
        top: 84px;
        transform: rotate(-2.8deg);
      }
      .card-2 {
        left: 142px;
        top: 249px;
        transform: rotate(2.8deg);
        z-index: 2;
      }
      .card-3 {
        left: 60px;
        top: 416px;
        transform: rotate(-2.8deg);
        z-index: 3;
      }
      .label {
        position: absolute;
        z-index: 4;
        padding: 10px;
        border-radius: 8px;
        font-size: 14px;
        line-height: 20px;
        font-weight: 500;
        backdrop-filter: blur(4px);
        background: rgba(35, 35, 35, 0.33);
        border: 1px solid transparent;
        white-space: nowrap;
      }
      .label-1 {
        left: 126px;
        top: 99px;
      }
      .label-2 {
        left: 44px;
        top: 339px;
      }
      .label-3 {
        left: 156px;
        top: 540px;
      }
      .footer {
        position: relative;
        z-index: 2;
        padding: 16px 20px 24px;
      }
      .cta {
        width: 100%;
        border: 0;
        border-radius: 12px;
        min-height: 48px;
        background: #fff;
        color: #121212;
        font-size: 16px;
        line-height: 24px;
        font-weight: 500;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="phone" data-name="splash-mockup">
      <img
        class="status-bar"
        src="/assets/acko-drive-splash/status-bar.svg"
        alt=""
      />
      <header class="header">
        <img
          class="logo"
          src="/assets/acko-drive-splash/acko-drive-logo.svg"
          alt="ACKO Drive Service Centres"
        />
      </header>
      <div class="stage">
        <div class="card card-1">
          <img src="/assets/acko-drive-splash/photo-garage.jpg" alt="" />
        </div>
        <div class="label label-1">Well-equipped garages</div>
        <div class="card card-2">
          <img src="/assets/acko-drive-splash/photo-estimate.jpg" alt="" />
        </div>
        <div class="label label-2">Pre-service estimates</div>
        <div class="card card-3">
          <img src="/assets/acko-drive-splash/photo-pickup.jpg" alt="" />
        </div>
        <div class="label label-3">Doorstep pickup & drop</div>
      </div>
      <footer class="footer">
        <button class="cta" type="button">Find nearby centre</button>
      </footer>
    </div>
  </body>
</html>
